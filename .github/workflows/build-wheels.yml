name: Build pywhispercpp wheels

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "빌드한 wheel을 GitHub Release에 등록"
        required: true
        type: boolean
        default: true

      release_tag:
        description: "Release 태그 이름"
        required: true
        type: string
        default: "v0.2.0"

  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────
  # Linux CPU / Vulkan wheels
  # ──────────────────────────────────────────
  build-linux:
    name: Build Linux wheel (${{ matrix.backend }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            whisper_vulkan: "1"
            needs_vulkan_sdk: true
            artifact: pywhispercpp-vulkan-linux

          - backend: cpu
            whisper_vulkan: "0"
            needs_vulkan_sdk: false
            artifact: pywhispercpp-cpu-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.16
        with:
          key: linux-${{ matrix.backend }}-py311-pywhispercpp
          evict-old-files: 7d

      # Vulkan 헤더와 glslc를 동일한 SDK 버전으로 설치합니다.
      # Ubuntu의 libvulkan-dev는 헤더 버전 충돌 방지를 위해 설치하지 않습니다.
      - name: Install Vulkan SDK
        if: matrix.needs_vulkan_sdk
        uses: jakoch/install-vulkan-sdk-action@v1.0.4
        with:
          vulkan_version: "1.3.280.0"
          install_runtime: false
          cache: true

      - name: Configure Vulkan SDK environment
        if: matrix.needs_vulkan_sdk
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$(find "$HOME/vulkan-sdk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | head -1)"

          if [ -z "$SDK_ROOT" ]; then
            echo "Vulkan SDK directory was not found."
            exit 1
          fi

          if [ -d "$SDK_ROOT/x86_64" ]; then
            ARCH_DIR="$SDK_ROOT/x86_64"
          else
            ARCH_DIR="$SDK_ROOT"
          fi

          echo "VULKAN_SDK=$ARCH_DIR" >> "$GITHUB_ENV"
          echo "$ARCH_DIR/bin" >> "$GITHUB_PATH"

          echo "Vulkan SDK: $ARCH_DIR"
          find "$ARCH_DIR" -name glslc -type f | head -1

      - name: Verify Vulkan SDK
        if: matrix.needs_vulkan_sdk
        shell: bash
        run: |
          set -euo pipefail
          which glslc
          glslc --version

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install \
            -y \
            --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            build \
            wheel \
            cmake \
            setuptools \
            setuptools-scm \
            ninja \
            pybind11 \
            numpy \
            repairwheel

      - name: Build ${{ matrix.backend }} wheel
        shell: bash
        env:
          WHISPER_VULKAN: ${{ matrix.whisper_vulkan }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail

          echo "Backend: ${{ matrix.backend }}"
          echo "WHISPER_VULKAN=$WHISPER_VULKAN"

          rm -rf build dist
          python -m build \
            --no-isolation \
            --wheel \
            --outdir dist/

      - name: Inspect generated wheel
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"
          ls -lh dist/

          WHEEL_COUNT="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"

          if [ "$WHEEL_COUNT" -ne 1 ]; then
            echo "Expected exactly one wheel, found: $WHEEL_COUNT"
            exit 1
          fi

          python -m zipfile -l dist/*.whl \
            | grep -E '\.(so|py)$' \
            | head -30 \
            || true

      - name: Upload ${{ matrix.backend }} wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  # ──────────────────────────────────────────
  # GitHub Release
  #
  # 다음 조건 중 하나일 때 실행됩니다.
  # 1. v로 시작하는 태그를 push한 경우
  # 2. 수동 실행에서 publish_release=true를 선택한 경우
  # ──────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - build-linux

    if: >-
      always() &&
      needs.build-linux.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_release == true
        )
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v5
        with:
          path: wheels/

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          find wheels \
            -type f \
            -name '*.whl' \
            -print \
            -exec cp '{}' release-files/ ';'

          echo "Release files:"
          ls -lh release-files/

          WHEEL_COUNT="$(find release-files -maxdepth 1 -name '*.whl' | wc -l)"

          if [ "$WHEEL_COUNT" -lt 2 ]; then
            echo "Expected at least two wheels, found: $WHEEL_COUNT"
            echo "CPU와 Vulkan wheel의 파일명이 같아 덮어써졌는지도 확인하세요."
            exit 1
          fi

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty."
            exit 1
          fi

          if [[ "$TAG" != v* ]]; then
            echo "Release tag must start with v."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: pywhispercpp Vulkan ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*.whl
          body: |
            ## pywhispercpp custom Linux wheels

            Python 3.11용 CPU 및 Vulkan wheel입니다.

            ### Vulkan 버전 설치

            ```bash
            pip install ./pywhispercpp_vulkan-*.whl
            ```

            ### CPU 버전 설치

            ```bash
            pip install ./pywhispercpp_cpu-*.whl
            ```

            ### Vulkan 사용 조건

            - Linux x86_64
            - Python 3.11
            - Vulkan을 지원하는 GPU
            - 호스트에 설치된 정상적인 Vulkan 드라이버

            설치 후 Vulkan 장치 확인:

            ```bash
            vulkaninfo --summary
            ```
